# Temis API (/etc/nginx/conf.d/temis.conf). Served under /temis/ in the bare-IP server block
# (sites-enabled/laya), see deploy/nginx/temis-location.conf.
# Inference is CPU-bound (~100-300 ms per call) and shares 4 cores with everything else here.
limit_req_zone  $binary_remote_addr zone=temis_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=temis_conn:10m;

upstream temis_backend {
    server 127.0.0.1:8093;
    keepalive 8;
}
