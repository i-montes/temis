# Temis API (/etc/nginx/snippets/temis-location.conf), included from the bare-IP server block.
# The trailing slash in proxy_pass strips /temis/; the app knows its prefix (TEMIS_ROOT_PATH).
# Errors nginx itself produces use the same JSON envelope as the app.
location = /temis {
    return 301 /temis/docs;
}
location /temis/ {
    limit_req  zone=temis_api burst=20 nodelay;
    limit_conn temis_conn 10;
    limit_req_status  429;
    limit_conn_status 429;
    client_max_body_size 256k;
    error_page 429 = @temis_429;
    error_page 413 = @temis_413;
    error_page 502 503 504 = @temis_down;

    proxy_pass http://temis_backend/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_buffering off;
}
location @temis_429 {
    default_type application/json;
    return 429 '{"detail":{"error_type":"rate_limit_error","message":"Too many requests. Limit: 120 per minute."}}';
}
location @temis_413 {
    default_type application/json;
    return 413 '{"detail":{"error_type":"api_usage_error","message":"Request too large (max 256 KB)."}}';
}
location @temis_down {
    default_type application/json;
    return 503 '{"detail":{"error_type":"overloaded_error","message":"Temis is not available right now. Try again shortly."}}';
}
